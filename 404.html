<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting 3D Album...</title>
    <style>
        body { background: #0a0a0c; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; }
        .pct-counter { color: #d4af37; font-size: 38px; font-weight: bold; font-family: monospace; margin-bottom: 5px; }
        .track { width: 260px; height: 7px; background: #222; border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .fill { width: 5%; height: 100%; background: linear-gradient(90deg, #d4af37, #ffeaa7); border-radius: 10px; transition: width 0.4s ease; }
    </style>
    <script>
        let p = 10;
        const timer = setInterval(() => {
            if (p < 92) {
                p += Math.floor(Math.random() * 7) + 3;
                if(p > 92) p = 92;
                document.getElementById('bar').style.width = p + '%';
                document.getElementById('num').innerText = p + '%';
            }
        }, 350);

        function checkLive() {
            fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
                .then(r => {
                    if (r.ok) {
                        clearInterval(timer);
                        document.getElementById('bar').style.width = '100%';
                        document.getElementById('num').innerText = '100%';
                        document.getElementById('stMsg').innerText = 'Album Live! Loading...';
                        setTimeout(() => window.location.reload(), 400);
                    } else {
                        setTimeout(checkLive, 2500);
                    }
                })
                .catch(() => setTimeout(checkLive, 2500));
        }
        setTimeout(checkLive, 1500);
    </script>
</head>
<body>
    <div class="pct-counter" id="num">10%</div>
    <div class="track"><div class="fill" id="bar"></div></div>
    <h2 style="color: #d4af37; margin-top: 25px; font-size: 18px; font-weight: 600;">Publishing 3D Album Online...</h2>
    <p id="stMsg" style="color: #777; font-size: 13px; margin-top: 4px;">Preparing high-res cloud pages, please wait.</p>
</body>
</html>
