<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Royal Wedding Album</title>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { 
            width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            user-select: none; display: flex; flex-direction: column; 
        }

        header { 
            height: 48px; background: rgba(18, 18, 18, 0.95); display: flex; justify-content: space-between; 
            align-items: center; padding: 0 15px; border-bottom: 1px solid #222; z-index: 100; flex-shrink: 0; 
        }
        .hdr-left { display: flex; align-items: center; gap: 8px; }
        .hdr-title { font-size: 14px; font-weight: bold; color: #d4af37; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
        
        .hdr-controls { display: flex; align-items: center; gap: 8px; }

        .btn-ctrl {
            background: #252525; border: 1px solid #3d3d3d; color: #fff;
            padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; gap: 4px; transition: 0.2s;
        }
        .btn-ctrl:active { transform: scale(0.95); }
        .btn-ctrl.active { background: #d4af37; color: #000; border-color: #d4af37; box-shadow: 0 0 10px rgba(212,175,55,0.4); }

        .music-btn { 
            background: #d4af37; border: none; width: 32px; height: 32px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            color: #000; font-size: 14px; box-shadow: 0 2px 8px rgba(212,175,55,0.4); 
        }
        .music-btn.muted { background: #444; color: #888; box-shadow: none; }

        .flip-stage { flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #book-box { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .page { background-color: #121212; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .page img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }
        
        .nav-arrow { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255,255,255,0.2); 
            color: white; width: 38px; height: 55px; font-size: 20px; border-radius: 6px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 60; 
        }
        .nav-prev { left: 8px; }
        .nav-next { right: 8px; }

        footer { 
            height: 38px; background: #121212; display: flex; justify-content: space-between; 
            align-items: center; padding: 0 15px; border-top: 1px solid #222; font-size: 11px; color: #777; z-index: 100; flex-shrink: 0; 
        }
        .page-num { color: #d4af37; font-weight: bold; }

        #rotateOverlay {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.94);
            z-index: 9999; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 25px; cursor: pointer;
        }
        .phone-rotate-icon {
            width: 55px; height: 85px; border: 3px solid #d4af37; border-radius: 12px;
            animation: rotateAnimation 2s ease-in-out infinite; margin-bottom: 25px;
            position: relative;
        }
        .phone-rotate-icon::after {
            content: ''; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            width: 8px; height: 8px; border-radius: 50%; background: #d4af37;
        }
        @keyframes rotateAnimation {
            0%, 20% { transform: rotate(0deg); }
            50%, 80% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        #loaderOverlay {
            position: fixed; inset: 0; background: #0c0c0e; z-index: 998;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 44px; height: 44px; border: 4px solid rgba(212,175,55,0.15);
            border-top-color: #d4af37; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

    <footer>

    <script>
        const pagesTotal = 106;
        let flipBook = null, isPlaying = false, autoPlayTimer = null, isAutoPlaying = false;
        const audio = document.getElementById('bgSong'), mBtn = document.getElementById('btnMusic'), autoBtn = document.getElementById('btnAutoPlay');

        function handleUserTap() {
            if (!isPlaying) {
                audio.play().then(() => { isPlaying = true; mBtn.classList.remove('muted'); }).catch(() => {});
            }
        }

        function toggleMusic(e) {
            e.stopPropagation();
            if (audio.paused) { audio.play(); isPlaying = true; mBtn.classList.remove('muted'); }
            else { audio.pause(); isPlaying = false; mBtn.classList.add('muted'); }
        }

        function toggleAutoPlay(e) {
            if(e) e.stopPropagation();
            handleUserTap();

            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            isAutoPlaying = true;
            autoBtn.innerText = "⏸ Pause";
            autoBtn.classList.add('active');

            if (autoPlayTimer) clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(() => {
                if (!flipBook) return;
                const cur = flipBook.getCurrentPageIndex();
                if (cur >= pagesTotal - 1) {
                    flipBook.flip(0);
                } else {
                    flipBook.flipNext();
                }
            }, 3500);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            autoBtn.innerText = "▶ Auto Flip";
            autoBtn.classList.remove('active');
            if (autoPlayTimer) { clearInterval(autoPlayTimer); autoPlayTimer = null; }
        }

        function manualNext() {
            if(flipBook) { flipBook.flipNext(); }
            resetAutoPlayOnUserTouch();
        }

        function manualPrev() {
            if(flipBook) { flipBook.flipPrev(); }
            resetAutoPlayOnUserTouch();
        }

        function resetAutoPlayOnUserTouch() {
            if (isAutoPlaying) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = setInterval(() => {
                    if (flipBook) flipBook.flipNext();
                }, 4000);
            }
        }

        function toggleFullScreen(e) {
            if(e) e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                tryLockLandscape();
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function tryLockLandscape() {
            document.getElementById('rotateOverlay').style.display = 'none';
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        function checkMobileOrientation() {
            const isPortrait = window.innerHeight > window.innerWidth;
            const isMobile = window.innerWidth < 900 || window.innerHeight < 600;
            const overlay = document.getElementById('rotateOverlay');

            if (isMobile && isPortrait) {
                overlay.style.display = 'flex';
            } else {
                overlay.style.display = 'none';
            }
        }

        function initResponsiveFlipbook() {
            const screenW = window.innerWidth, screenH = window.innerHeight - 86, isPortrait = screenH > screenW;
            let bW, bH;

            if (isPortrait) {
                bW = Math.floor(Math.min(screenW * 0.94, 540));
                bH = Math.floor(Math.min(screenH * 0.88, bW * 1.45));
            } else {
                bH = Math.floor(Math.min(screenH * 0.94, 900));
                bW = Math.floor(Math.min((screenW * 0.94) / 2, bH * 0.72));
            }

            if (flipBook) { try { flipBook.destroy(); } catch (e) {} }

            flipBook = new St.PageFlip(document.getElementById('book'), {
                width: bW, height: bH, size: "fixed", minWidth: 200, maxWidth: 1600, minHeight: 280, maxHeight: 1800, 
                maxShadowOpacity: 0.5, showCover: true, mobileScrollSupport: false, usePortrait: isPortrait, 
                startPage: 0, flippingTime: 650
            });

            flipBook.loadFromHTML(document.querySelectorAll('.page'));

            flipBook.on('flip', (e) => {
                document.getElementById('pageCount').innerText = "Page " + (e.data + 1) + " of " + pagesTotal;
                handleUserTap();
            });

            setTimeout(() => {
                const ldr = document.getElementById('loaderOverlay');
                if(ldr) ldr.style.display = 'none';
            }, 600);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initResponsiveFlipbook();
            checkMobileOrientation();
        });

        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                initResponsiveFlipbook();
                checkMobileOrientation();
            }, 300);
        });

        window.addEventListener('resize', () => {
            clearTimeout(window.rt);
            window.rt = setTimeout(() => {
                initResponsiveFlipbook();
                checkMobileOrientation();
            }, 250);
        });
    </script>
