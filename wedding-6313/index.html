        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 132, 255, 0.3); border: 1px solid rgba(255,255,255,0.2); color: white; width: 40px; height: 55px; font-size: 22px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 50; }
        .nav-prev { left: 10px; }

        footer { height: 42px; background: #121212; display: flex; justify-content: center; align-items: center; gap: 15px; border-top: 1px solid #222; font-size: 12px; color: #777; z-index: 100; }

    </footer>
    <script>
        const pagesTotal = 100;
        let flipBook = null;
        let isPlaying = false;
        const audio = document.getElementById('bgSong');
        const mBtn = document.getElementById('btnMusic');

        function startAudioOnInteraction() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    mBtn.classList.remove('muted');
                }).catch(() => {});
            }
        }

        function toggleMusic(e) {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                isPlaying = true;
                mBtn.classList.remove('muted');
            } else {
                audio.pause();
                isPlaying = false;
                mBtn.classList.add('muted');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const isMobile = window.innerWidth < 768;
            const bookWidth = isMobile ? window.innerWidth * 0.95 : 550;
            const bookHeight = isMobile ? window.innerHeight * 0.75 : 750;

            flipBook = new St.PageFlip(document.getElementById('book'), {
                width: bookWidth,
                height: bookHeight,
                size: isMobile ? "fixed" : "stretch",
                minWidth: 300,
                maxWidth: 1200,
                minHeight: 400,
                maxHeight: 1400,
                maxShadowOpacity: 0.8,
                showCover: true,
                mobileScrollSupport: false,
                usePortrait: isMobile,
                startPage: 0,
                flippingTime: 650
            });

            flipBook.loadFromHTML(document.querySelectorAll('.page'));

            flipBook.on('flip', (e) => {
                const cur = e.data + 1;
                document.getElementById('pageCount').innerText = "Page " + cur + " of " + pagesTotal;
                startAudioOnInteraction();
            });
        });
    </script>
