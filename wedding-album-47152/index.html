    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; display: flex; flex-direction: column; }
        header { position: absolute; top: 0; left: 0; right: 0; height: 42px; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); display: flex; justify-content: space-between; align-items: center; padding: 0 12px; z-index: 100; pointer-events: none; }
        .hdr-left, .hdr-controls { pointer-events: auto; display: flex; align-items: center; gap: 8px; }
        .hdr-title { font-size: 13px; font-weight: bold; color: #d4af37; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .btn-ctrl { background: rgba(35, 35, 35, 0.8); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 10px; border-radius: 18px; font-size: 11px; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px); }
        .btn-ctrl.active { background: #d4af37; color: #000; border-color: #d4af37; }
        .music-btn { background: #d4af37; border: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #000; font-size: 13px; }
        .music-btn.muted { background: #444; color: #888; }
        .flip-stage { flex: 1; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        #book-box { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .page { background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .page img { width: 100%; height: 100%; object-fit: fill; pointer-events: none; display: block; }
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.15); color: white; width: 34px; height: 50px; font-size: 18px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 60; }
        .nav-prev { left: 4px; }
        .nav-next { right: 4px; }
        footer { position: absolute; bottom: 0; left: 0; right: 0; height: 28px; background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); display: flex; justify-content: space-between; align-items: center; padding: 0 14px; font-size: 10px; color: #aaa; z-index: 100; pointer-events: none; }
        .page-num { color: #d4af37; font-weight: bold; pointer-events: auto; }
        #loaderOverlay { position: fixed; inset: 0; background: #000; z-index: 998; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .progress-box { width: 220px; height: 5px; background: #222; border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .progress-bar { width: 0%; height: 100%; background: #d4af37; transition: width 0.2s ease; }
        .percent-txt { color: #d4af37; font-size: 22px; font-weight: bold; font-family: monospace; margin-top: 10px; }
    </style>
</head>

    <footer>
        <span>Swipe sheets to flip</span>
        <span class="page-num" id="pageCount">Cover</span>
    </footer>
    <script>
        const pagesTotal = 96;
        let flipBook = null, isPlaying = false, autoPlayTimer = null, isAutoPlaying = false, lastPageIndex = 0;
        const audio = document.getElementById('bgSong'), mBtn = document.getElementById('btnMusic'), autoBtn = document.getElementById('btnAutoPlay');
        const rawBookHtml = document.getElementById('book-box').innerHTML;

        function handleUserTap() {
            if (!isPlaying) {
                audio.play().then(() => { isPlaying = true; mBtn.classList.remove('muted'); }).catch(() => {});
            }
        }
        function toggleMusic(e) {
            e.stopPropagation();
            if (audio.paused) { audio.play(); isPlaying = true; mBtn.classList.remove('muted'); }
            else { audio.pause(); isPlaying = false; mBtn.classList.add('muted'); }
        }
        function toggleAutoPlay(e) {
            e.stopPropagation();
            handleUserTap();
            if (isAutoPlaying) {
                isAutoPlaying = false; autoBtn.innerText = "▶ Auto"; autoBtn.classList.remove('active');
                if (autoPlayTimer) clearInterval(autoPlayTimer);
            } else {
                isAutoPlaying = true; autoBtn.innerText = "⏸ Pause"; autoBtn.classList.add('active');
                if (autoPlayTimer) clearInterval(autoPlayTimer);
                autoPlayTimer = setInterval(() => {
                    if (!flipBook) return;
                    if (flipBook.getCurrentPageIndex() >= pagesTotal - 1) flipBook.flip(0);
                    else flipBook.flipNext();
                }, 3500);
            }
        }
        function manualNext(e) { if(e) e.stopPropagation(); if(flipBook) flipBook.flipNext(); }
        function manualPrev(e) { if(e) e.stopPropagation(); if(flipBook) flipBook.flipPrev(); }
        function toggleFullScreen(e) {
            if(e) e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }
        function buildFlipBook() {
            document.getElementById('book-box').innerHTML = rawBookHtml;
            const screenW = window.innerWidth, screenH = window.innerHeight, isPortrait = screenH > screenW;
            let bW, bH;
            if (isPortrait) {
                bW = Math.floor(screenW * 0.98);
                bH = Math.floor(Math.min(screenH * 0.85, bW * 1.5));
            } else {
                bH = Math.floor(screenH * 0.96);
                bW = Math.floor((bH * 18) / 12);
                if (bW * 2 > screenW * 0.98) {
                    bW = Math.floor((screenW * 0.98) / 2);
                    bH = Math.floor((bW * 12) / 18);
                }
            }
            flipBook = new St.PageFlip(document.getElementById('book'), {
                width: bW, height: bH, size: "fixed", minWidth: 200, maxWidth: 2400, minHeight: 280, maxHeight: 2000,
                maxShadowOpacity: 0.4, showCover: true, mobileScrollSupport: false, usePortrait: isPortrait,
                startPage: lastPageIndex, flippingTime: 500
            });
            flipBook.loadFromHTML(document.querySelectorAll('.page'));
            flipBook.on('flip', (e) => {
                lastPageIndex = e.data;
                document.getElementById('pageCount').innerText = "Page " + (e.data + 1) + " of " + pagesTotal;
                handleUserTap();
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            buildFlipBook();
            let cur = 0;
            const bar = document.getElementById('pctBar'), val = document.getElementById('pctVal');
            const iv = setInterval(() => {
                cur += 25;
                if (cur >= 100) {
                    clearInterval(iv);
                    document.getElementById('loaderOverlay').style.display = 'none';
                } else {
                    bar.style.width = cur + '%'; val.innerText = cur + '%';
                }
            }, 40);
        });
        window.addEventListener('resize', () => {
            clearTimeout(window.rt);
            window.rt = setTimeout(() => {
                if (flipBook) try { lastPageIndex = flipBook.getCurrentPageIndex(); } catch(e){}
                buildFlipBook();
            }, 200);
        });
    </script>
